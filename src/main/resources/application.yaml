spring:
  application:
    name: fidmap
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true


  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email



application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000 # one day 86400000
      refresh-token:
        expiration: 604800000  # 7 days


paddle:
  api-url: ${PADDLE_API_URL}
  api-key: ${PADDLE_API_KEY}
  webhook-secret: ${PADDLE_WEBHOOK_SECRET}
  client-token: ${PADDLE_CLIENT_TOKEN}

  prices:
    startupMonthly: ${PADDLE_STARTUP_MONTHLY_PRICE_ID}
    startupYearly: ${PADDLE_STARTUP_YEARLY_PRICE_ID}
    businessMonthly: ${PADDLE_BUSINESS_MONTHLY_PRICE_ID}
    businessYearly: ${PADDLE_BUSINESS_YEARLY_PRICE_ID}
    lifetime: ${PADDLE_LIFETIME_PRICE_ID}


resend:
  api-key: ${RESEND_API_KEY}
fidmap:
  frontend-url: ${FIDMAP_FRONTEND_URL:http://localhost:5173}


