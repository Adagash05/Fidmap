server:
  port: ${PORT:8080}

spring:
  application:
    name: fidmap

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000

      refresh-token:
        expiration: 604800000


polar:
  apiUrl: ${POLAR_API_URL:https://sandbox-api.polar.sh/v1}
  accessToken: ${POLAR_CLIENT_TOKEN}
  webhookSecret: ${POLAR_WEBHOOK_SECRET}

  products:
    startupMonthly: ${POLAR_STARTUP_MONTHLY_PRODUCT_ID}
    startupYearly: ${POLAR_STARTUP_YEARLY_PRODUCT_ID}
    businessMonthly: ${POLAR_BUSINESS_MONTHLY_PRODUCT_ID}
    businessYearly: ${POLAR_BUSINESS_YEARLY_PRODUCT_ID}
    lifetime: ${POLAR_LIFETIME_PRODUCT_ID}


resend:
  api-key: ${RESEND_API_KEY}

fidmap:
  frontend-url: ${FIDMAP_FRONTEND_URL:http://localhost:5173}

